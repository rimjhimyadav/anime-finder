<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anime Finder</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold fs-3" href="#">Anime<span class="text-purple">Finder</span></a>

      <div class="d-flex gap-2">
        <input type="text" id="search-input" class="form-control" placeholder="Search anime...">
        <button id="search-btn" class="btn btn-purple">Search</button>
      </div>
    </div>
  </nav>

  <!-- big banner at the top -->
  <section id="hero">
    <div class="container">
      <div class="hero-content col-lg-6">
        <span class="badge bg-purple mb-2">🔥 #1 Trending</span>
        <h1 id="hero-title" class="display-5 fw-bold">Loading...</h1>
        <p id="hero-info" class="text-purple fw-bold mb-2"></p>
        <p id="hero-desc"></p>
        <button id="hero-more" class="btn btn-purple btn-lg me-2">More Info</button>
        <button id="hero-add" class="btn btn-outline-light btn-lg fw-bold add-btn">+ My List</button>
      </div>
    </div>
  </section>

  <main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">
      <div class="nav nav-pills gap-2">
        <button class="nav-link tab active" data-tab="trending">Trending</button>
        <button class="nav-link tab" data-tab="top">Top Rated</button>
        <button class="nav-link tab" data-tab="popular">Popular</button>
        <button class="nav-link tab" data-tab="upcoming">Upcoming</button>
        <button class="nav-link tab" data-tab="mylist">My List (<span id="list-count">0</span>)</button>
      </div>

      <select id="genre-select" class="form-select w-auto">
        <option value="">All Genres</option>
        <option>Action</option>
        <option>Adventure</option>
        <option>Comedy</option>
        <option>Drama</option>
        <option>Fantasy</option>
        <option>Horror</option>
        <option>Mystery</option>
        <option>Romance</option>
        <option>Sci-Fi</option>
        <option>Slice of Life</option>
        <option>Sports</option>
        <option>Supernatural</option>
        <option>Thriller</option>
      </select>
    </div>

    <!-- only shown on my list -->
    <div id="list-filters" class="d-flex flex-wrap gap-2 d-none mt-3">
      <button class="btn btn-sm btn-outline-secondary rounded-pill chip-btn active" data-status="All">All</button>
      <button class="btn btn-sm btn-outline-secondary rounded-pill chip-btn" data-status="Watching">Watching</button>
      <button class="btn btn-sm btn-outline-secondary rounded-pill chip-btn" data-status="Plan to Watch">Plan to Watch</button>
      <button class="btn btn-sm btn-outline-secondary rounded-pill chip-btn" data-status="Completed">Completed</button>
    </div>

    <h3 id="title" class="mt-4 mb-3">Trending Now</h3>
    <p id="message" class="text-secondary"></p>

    <div id="anime-grid" class="row row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-lg-6 g-3"></div>

    <div class="text-center mt-4">
      <button id="load-more" class="btn btn-outline-light px-4 d-none">Load More</button>
    </div>
  </main>

  <!-- popup with anime details -->
  <div class="modal fade" id="popup" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        <button type="button" class="btn-close position-absolute top-0 end-0 m-3" data-bs-dismiss="modal"></button>

        <div class="modal-body p-0">
          <div id="popup-banner"></div>

          <div class="px-4 pb-4">
            <div class="row g-3">
              <div class="col-auto">
                <img id="popup-cover" src="" alt="">
              </div>
              <div class="col">
                <h3 id="popup-title" class="mt-3 mb-1"></h3>
                <p id="popup-info" class="text-purple fw-bold mb-2"></p>
                <div id="popup-genres" class="d-flex flex-wrap gap-1"></div>
                <div class="d-flex flex-wrap gap-2 mt-3">
                  <button id="popup-add" class="btn btn-purple add-btn">+ My List</button>
                  <select id="popup-status" class="form-select w-auto d-none">
                    <option>Plan to Watch</option>
                    <option>Watching</option>
                    <option>Completed</option>
                  </select>
                  <a id="popup-trailer" class="btn btn-outline-light" target="_blank">▶ Trailer</a>
                </div>
              </div>
            </div>

            <p id="popup-synopsis" class="mt-4 mb-4 text-light-emphasis"></p>

            <div class="row g-3 bg-body-tertiary rounded p-2 mx-0">
              <div class="col-6 col-md-4"><small class="text-secondary">Format</small><p id="d-format" class="fw-bold mb-0"></p></div>
              <div class="col-6 col-md-4"><small class="text-secondary">Episodes</small><p id="d-episodes" class="fw-bold mb-0"></p></div>
              <div class="col-6 col-md-4"><small class="text-secondary">Duration</small><p id="d-duration" class="fw-bold mb-0"></p></div>
              <div class="col-6 col-md-4"><small class="text-secondary">Status</small><p id="d-status" class="fw-bold mb-0"></p></div>
              <div class="col-6 col-md-4"><small class="text-secondary">Studio</small><p id="d-studio" class="fw-bold mb-0"></p></div>
              <div class="col-6 col-md-4"><small class="text-secondary">Popularity</small><p id="d-popularity" class="fw-bold mb-0"></p></div>
            </div>

            <a id="popup-link" class="d-inline-block mt-3 text-purple fw-bold text-decoration-none" target="_blank">View on AniList →</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- small message at the bottom -->
  <div class="toast-container position-fixed bottom-0 start-50 translate-middle-x p-3">
    <div id="toast" class="toast border-0">
      <div id="toast-text" class="toast-body fw-bold"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
